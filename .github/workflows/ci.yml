name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Lockfile resolves undici 8.10.0 (via jsdom), whose engines require
          # node >=22.19.0; node 20 crashes with "webidl.util.markAsUncloneable
          # is not a function". Use node 24 to match local dev.
          node-version: 24
      # npm ci installs strictly from the lockfile; `npm install` hits
      # npm/cli#4828 and can skip oxlint's linux-x64 native binding in CI.
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --reporter=verbose
        timeout-minutes: 5

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g netlify-cli@27.0.1
      # --build runs the netlify.toml build (frontend) AND bundles the
      # serverless functions, so the /api backend ships with the site.
      - run: netlify deploy --prod --build --site=99d46508-7515-4af3-9de5-18e0b2a6e6b4
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}<
