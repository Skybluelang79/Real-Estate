name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # >= 20.18.1 required by undici (pulled in by jsdom/vitest); older
          # 20.x fails tests with "webidl.util.markAsUncloneable is not a function".
          node-version: 20.18.1
      - run: npm install
      - run: npm run lint
      - run: npm run test -- --reporter=verbose
        timeout-minutes: 2

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
      - run: npm install -g netlify-cli
      # --build runs the netlify.toml build (frontend) AND bundles the
      # serverless functions, so the /api backend ships with the site.
      - run: netlify deploy --prod --build --site-id=99d46508-7515-4af3-9de5-18e0b2a6e6b4
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}<
